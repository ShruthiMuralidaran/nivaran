<style>
/* Nivaran design system */
:root {
  --navy: #1e2a4a;
  --navy-2: #16203a;
  --navy-3: #2f4a8f;
  --blue: #2563eb;
  --blue-600: #1d4ed8;
  --sky: #60a5fa;
  --blue-50: #eff6ff;
  --blue-100: #dbeafe;
  --bg: #f8fafc;
  --card: #ffffff;
  --line: #e2e8f0;
  --line-2: #cbd5e1;
  --ink: #0f172a;
  --ink-2: #1e293b;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --green: #15803d;
  --green-bg: #dcfce7;
  --green-line: #86efac;
  --amber: #b45309;
  --amber-bg: #fef3c7;
  --amber-line: #fcd34d;
  --red: #b91c1c;
  --red-bg: #fee2e2;
  --red-line: #fca5a5;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 4px 16px rgba(15, 23, 42, .06);
  --shadow-lg: 0 10px 40px rgba(15, 23, 42, .12);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { color: var(--ink); margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
p { margin: 0; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Header / band ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(22, 32, 58, .96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(148, 163, 184, .18);
}
.topbar .inner { max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
.brand:hover { text-decoration: none; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #3b82f6, #4f46e5); display: grid; place-items: center; color: #fff; box-shadow: 0 4px 14px rgba(37, 99, 235, .45), inset 0 0 0 1px rgba(255, 255, 255, .22); }
.logo svg { width: 19px; height: 19px; }
.nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; padding: 4px; border-radius: 999px; background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1); }
.nav a { display: inline-flex; align-items: center; gap: 7px; color: #cbd5e1; font-weight: 600; font-size: 14px; padding: 7px 14px; border-radius: 999px; transition: background .15s, color .15s; }
.nav a svg { width: 15px; height: 15px; flex: none; }
.nav a:hover { color: #fff; background: rgba(255, 255, 255, .08); text-decoration: none; }
.nav a.active { color: var(--navy); background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
.topbar .right { display: flex; align-items: center; gap: 10px; }
.topbar .right:empty { display: none; }
.meter { color: #cbd5e1; font-size: 12.5px; border: 1px solid rgba(148, 163, 184, .3); border-radius: 999px; padding: 5px 11px; white-space: nowrap; }
.meter b { color: #fff; }
.gear { font: inherit; font-size: 17px; line-height: 1; color: #cbd5e1; background: transparent; border: 1px solid rgba(148, 163, 184, .3); border-radius: 999px; width: 34px; height: 34px; cursor: pointer; }
.gear:hover { color: #fff; border-color: #fff; }
.mode { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.mode.live { background: rgba(34, 197, 94, .16); color: #86efac; border: 1px solid rgba(134, 239, 172, .35); }
.mode.offline { background: rgba(245, 158, 11, .16); color: #fcd34d; border: 1px solid rgba(252, 211, 77, .35); }
.mode.unknown { background: rgba(148, 163, 184, .15); color: #cbd5e1; }

.band {
  background:
    radial-gradient(circle at 88% 0%, var(--navy-3) 0%, rgba(47, 74, 143, 0) 55%),
    repeating-linear-gradient(90deg, rgba(96, 165, 250, .06) 0 1px, transparent 1px 64px),
    var(--navy);
  color: #fff;
  position: relative;
}
.band::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--blue), var(--sky) 45%, transparent); }
.band .inner { max-width: 1200px; margin: 0 auto; padding: 34px 20px 64px; }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 700; color: var(--sky); }
.band h1 { color: #fff; font-size: 34px; font-weight: 800; letter-spacing: -0.03em; margin-top: 8px; }
.band p.lead { color: #cbd5e1; font-size: 16px; margin-top: 8px; max-width: 760px; }

.page { max-width: 1200px; margin: -40px auto 0; padding: 0 20px 64px; position: relative; z-index: 2; }

/* ---------- Cards / grid ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.card + .card { margin-top: 18px; }
.grid > .card, .grid > .card + .card { margin-top: 0; }
.btn { white-space: nowrap; }
.card h2 { font-size: 18px; font-weight: 750; }
.card h3 { font-size: 15px; font-weight: 700; }
.card .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; }
.stack > * + * { margin-top: 14px; }
@media (max-width: 980px) {
  .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
  .split, .grid-2 { grid-template-columns: 1fr; }
  .meter { display: none; }
}
@media (max-width: 620px) {
  .card-head { flex-wrap: wrap; }
  .btn { white-space: normal; text-align: center; }
  .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .band h1 { font-size: 26px; }
  .topbar .inner { flex-wrap: wrap; }
  .nav { order: 3; width: 100%; margin-left: 0; }
}

/* ---------- KPI ---------- */
.kpi { padding: 18px 20px; }
.kpi .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.kpi .value { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; color: var(--ink); margin-top: 6px; }
.kpi .value small { font-size: 15px; color: var(--muted-2); font-weight: 600; }
.kpi .note { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.kpi.red .value { color: var(--red); }
.kpi.green .value { color: var(--green); }
.kpi.blue .value { color: var(--blue); }
.kpi.amber .value { color: var(--amber); }

/* ---------- Forms ---------- */
label.field { display: block; }
label.field > span { display: block; font-size: 13px; font-weight: 650; color: var(--ink-2); margin-bottom: 6px; }
label.field > span em { font-style: normal; color: var(--muted); font-weight: 500; }
input[type=text], select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: #fbfdff;
  border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
input[type=text]:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); background: #fff; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
.counter { float: right; font-weight: 500; color: var(--muted-2); font-size: 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; min-width: 160px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips .lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-right: 2px; }
.chip { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; color: var(--ink-2); cursor: pointer; }
.chip:hover { border-color: var(--blue); color: var(--blue); }
.chip.good { border-color: var(--green-line); background: #f0fdf4; color: var(--green); }
.chip.bad { border-color: var(--red-line); background: #fef2f2; color: var(--red); }
.chip.warn { border-color: var(--amber-line); background: #fffbeb; color: var(--amber); }

.btn { font: inherit; font-weight: 700; font-size: 15px; border: 0; border-radius: 11px; padding: 12px 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .05s, background .15s, opacity .15s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--blue); color: #fff; box-shadow: 0 6px 18px rgba(37, 99, 235, .3); }
.btn-primary:hover { background: var(--blue-600); text-decoration: none; }
.btn-ghost { background: #fff; color: var(--ink-2); border: 1px solid var(--line-2); }
.btn-ghost:hover { border-color: var(--blue); color: var(--blue); text-decoration: none; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .6; cursor: not-allowed; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: spin .8s linear infinite; }
.btn-ghost .spinner { border-color: rgba(37, 99, 235, .25); border-top-color: var(--blue); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Pills / badges ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.pill.resolved { background: var(--green-bg); color: var(--green); border-color: var(--green-line); }
.pill.review { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-line); }
.pill.hollow { background: var(--red-bg); color: var(--red); border-color: var(--red-line); }
.pill.blue { background: var(--blue-50); color: var(--blue); border-color: var(--blue-100); }
.pill.grey { background: #f1f5f9; color: var(--muted); border-color: var(--line); }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--blue-50); color: var(--blue); margin: 2px 4px 2px 0; }

/* ---------- Results ---------- */
.score-wrap { display: flex; align-items: center; gap: 20px; }
.ring { width: 112px; height: 112px; flex: none; }
.ring .num { font-size: 28px; font-weight: 800; fill: var(--ink); }
.ring .den { font-size: 11px; fill: var(--muted); font-weight: 600; }
.verdict-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
.cap-note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.crit { display: grid; grid-template-columns: 180px 1fr 44px; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.crit:first-child { border-top: 0; }
.crit .name { font-weight: 650; font-size: 14px; }
.crit .reason { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-top: -4px; }
.bar { height: 8px; border-radius: 999px; background: #eef2f7; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--blue); width: 0; transition: width .6s ease; }
.bar > i.g { background: #22c55e; } .bar > i.a { background: #f59e0b; } .bar > i.r { background: #ef4444; }
.crit .val { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
@media (max-width: 620px) { .crit { grid-template-columns: 1fr 44px; } .crit .bar { grid-column: 1 / -1; grid-row: 2; } }

.fm { border: 1px solid var(--amber-line); background: #fffbeb; border-radius: 12px; padding: 12px 14px; }
.fm + .fm { margin-top: 10px; }
.fm .t { font-weight: 750; color: var(--amber); font-size: 14px; }
.fm .h { font-size: 12.5px; color: var(--muted); }
.fm blockquote { margin: 8px 0 0; padding: 8px 12px; background: #fff; border-left: 3px solid #f59e0b; border-radius: 6px; font-size: 13.5px; color: var(--ink-2); }
.ok-box { border: 1px solid var(--green-line); background: #f0fdf4; color: var(--green); border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 14px; }
.err-box { border: 1px solid var(--red-line); background: #fef2f2; color: var(--red); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.info-box { border: 1px solid var(--blue-100); background: var(--blue-50); color: var(--ink-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.warn-box { border: 1px solid var(--amber-line); background: #fffbeb; color: #92400e; border-radius: 12px; padding: 12px 14px; font-size: 14px; }

.statline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.stat .v { font-size: 17px; font-weight: 800; color: var(--ink); margin-top: 2px; font-variant-numeric: tabular-nums; }
@media (max-width: 620px) { .statline { grid-template-columns: 1fr 1fr; } }

.list-clean { list-style: none; padding: 0; margin: 0; }
.list-clean li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.list-clean li:first-child { border-top: 0; }
.src { display: flex; gap: 10px; align-items: baseline; }
.src .id { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--blue); background: var(--blue-50); padding: 2px 7px; border-radius: 6px; white-space: nowrap; }

details.more { margin-top: 12px; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 600; }
details.more[open] summary { margin-bottom: 8px; }

/* ---------- Draft ---------- */
.draft-box { width: 100%; min-height: 300px; font-size: 15px; line-height: 1.65; background: #fff; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Trace ---------- */
.trace { list-style: none; margin: 0; padding: 0; position: relative; }
.trace li { position: relative; padding: 0 0 14px 28px; }
.trace li::before { content: ''; position: absolute; left: 7px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.trace li:last-child::before { display: none; }
.trace .dot { position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px var(--blue-50); }
.trace .st { font-weight: 700; font-size: 14px; color: var(--ink); }
.trace .meta { font-size: 12.5px; color: var(--muted); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: #f8fafc; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.clickable { cursor: pointer; }
table.t tr.clickable:hover td { background: #f8fbff; }

.progress { height: 10px; background: #eef2f7; border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--sky)); width: 0; transition: width .3s; }

.hbar { display: grid; grid-template-columns: 210px 1fr 48px; gap: 10px; align-items: center; padding: 6px 0; font-size: 13.5px; }
.hbar .bar { height: 10px; }
@media (max-width: 620px) { .hbar { grid-template-columns: 1fr 48px; } .hbar .bar { grid-column: 1 / -1; } }

/* ---------- Flow diagram ---------- */
.flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; align-items: stretch; }
.flow .node { background: #fff; border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; position: relative; }
.flow .node + .node { margin-left: 28px; }
.flow .node + .node::before { content: '→'; position: absolute; left: -24px; top: 50%; transform: translateY(-50%); color: var(--muted-2); font-weight: 700; }
.flow .node .k { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--blue); text-transform: uppercase; }
.flow .node .d { font-size: 13.5px; margin-top: 4px; color: var(--ink-2); }
.flow .node.ai { border: 2px solid var(--blue); }
.flow .node.code { border-style: dashed; }
.flow.amber .node .k { color: var(--amber); }
.flow.amber .node.ai { border-color: #f59e0b; }
@media (max-width: 980px) { .flow { grid-template-columns: 1fr; } .flow .node + .node { margin-left: 0; margin-top: 22px; } .flow .node + .node::before { content: '↓'; left: 50%; top: -20px; transform: none; } }

/* ---------- Feature cards ---------- */
.feature { display: flex; flex-direction: column; gap: 10px; }
.feature .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--blue-50); color: var(--blue); }
.feature .ico svg { width: 22px; height: 22px; }
.feature p { color: var(--muted); font-size: 14px; }
.feature .go { margin-top: auto; font-weight: 700; font-size: 14px; }

.empty { text-align: center; padding: 34px 20px; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 18px; margin-bottom: 6px; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; opacity: 0; transition: all .2s; z-index: 50; box-shadow: var(--shadow-lg); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

footer.foot { max-width: 1200px; margin: 0 auto; padding: 24px 20px 40px; color: var(--muted); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; border-top: 1px solid var(--line); }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.kb-item { padding: 14px 0; border-top: 1px solid var(--line); }
.kb-item:first-child { border-top: 0; }
.kb-item p { font-size: 14px; color: var(--ink-2); margin-top: 4px; }

/* ---- Added: AI usage line, testimonial, failure-mode guide ---- */
.usage { margin-top: 14px; border-top: 1px dashed var(--line-2); padding-top: 10px; }
.usage summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); list-style: none; }
.usage summary::-webkit-details-marker { display: none; }
.usage summary::before { content: '▸ '; }
.usage[open] summary::before { content: '▾ '; }
.usage .statline { margin-top: 10px; }
.testimonial { text-align: center; border: 1px solid var(--amber-line); background: #fffbeb; border-radius: 16px; padding: 28px 24px; }
.testimonial .q { font-size: 40px; line-height: 1; color: #f59e0b; font-weight: 800; }
.testimonial blockquote { margin: 6px auto 0; max-width: 720px; font-size: 18px; font-style: italic; color: var(--ink-2); line-height: 1.6; border: 0; padding: 0; background: none; }
.testimonial .who { margin-top: 12px; font-size: 14px; font-weight: 700; color: #b45309; }

</style>
</head>
<body>
<div id="root"></div>

<div id="settings" class="hidden" style="position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px">
  <div class="card" style="max-width:620px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg)">
    <div class="card-head"><div><h2>Settings</h2><div class="sub">Connect Nivaran to its AI service (one-time setup).</div></div><button class="btn btn-ghost" id="s-close" aria-label="Close">✕</button></div>
    <div class="stack">

        <select id="s-provider"><option value="gemini">Google Gemini</option><option value="openai">OpenAI</option><option value="offline">Offline demo (no AI, rule-based)</option></select></label>
      <label class="field" id="s-key-wrap"><span>API key</span><input type="text" id="s-key" autocomplete="off" spellcheck="false" placeholder="Paste your key" style="-webkit-text-security:disc">
        <div class="hint" id="s-key-hint"></div></label>
      <label class="field"><span>Model <em>(optional)</em></span><input type="text" id="s-model" placeholder="default"></label>
      <label class="small" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" id="s-remember" style="margin-top:3px;flex:none"><span>Remember the key on this computer (otherwise it is forgotten when you close the tab)</span></label>
      <div class="info-box small">Your key is kept only in this browser and sent only to Google or OpenAI. It is never written into this HTML file, so the file is safe to share or submit.</div>
      <div class="row"><button class="btn btn-primary" id="s-save">Save</button><button class="btn btn-ghost" id="s-test">Save &amp; test</button><button class="btn btn-ghost" id="s-clear" style="margin-left:auto">Forget key</button></div>
      <div id="s-msg" class="hidden"></div>
      <details class="more" id="s-cost"><summary>Cost log (for the team, not shown to officers)</summary>
        <div id="s-cost-body" class="small"></div>
        <div class="row mt-12"><button class="btn btn-ghost" id="s-cost-csv">Download cost log (CSV)</button><button class="btn btn-ghost" id="s-cost-reset">Reset log</button></div>
      </details>
    </div>
  </div>
</div>
<template id="tpl-0"><section class="band"><div class="inner">
  <div class="eyebrow">AI quality layer for grievance redressal</div>
  <h1>Disposed is not the same as resolved.</h1>
  <p class="lead">India closes grievances faster than ever, but nothing measures whether the citizen's problem was solved. Nivaran checks each closure for the failure modes DARPG documents, and helps officers write replies that hold up.</p>
</div></section>

<main class="page">
  <div class="grid grid-4">
    <div class="card kpi blue"><div class="label">Disposals, 2024</div><div class="value">26.45L</div><div class="note">CPGRAMS, an all-time high</div></div>
    <div class="card kpi green"><div class="label">Avg resolution time</div><div class="value">13<small> days</small></div><div class="note">down from 32 days in 2021</div></div>
    <div class="card kpi red"><div class="label">Citizen satisfaction</div><div class="value">~50%</div><div class="note">measured independently</div></div>
    <div class="card kpi amber"><div class="label">Repeat filings</div><div class="value">8.59L</div><div class="note">across 20 categories</div></div>
  </div>
  <p class="hint mt-8">Sources: DARPG 48th CPGRAMS Monthly Report (Apr 2026); IMPRI Policy Brief 2025–26.</p>

  <div class="grid grid-2 mt-24">
    <a class="card feature" href="#/judge" style="color:inherit;text-decoration:none">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>
      <h2>Resolution Judge</h2>
      <p>Scores one closure against five criteria and the documented failure modes, quoting the exact words that triggered each flag.</p>
      <span class="go">Check a reply →</span>
    </a>
    <a class="card feature" href="#/copilot" style="color:inherit;text-decoration:none">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></div>
      <h2>Resolution Copilot</h2>
      <p>Drafts a reply from the officer's findings and the matching SOP, checks every figure, has the Judge score it, and revises once if needed.</p>
      <span class="go">Draft a reply →</span>
    </a>
  </div>

  <div class="card mt-24">
    <div class="card-head"><div><h2>How a closure gets checked</h2><div class="sub">What happens when you press Evaluate</div></div><a href="#/how" class="btn btn-ghost">Architecture, model and cost →</a></div>
    <div class="flow">
      <div class="node"><div class="k">Input</div><div class="d">Complaint + officer's reply</div></div>
      <div class="node code"><div class="k">Find rules</div><div class="d">Finds the SOP rules that apply</div></div>
      <div class="node ai"><div class="k">Judge</div><div class="d">Scores 5 criteria and flags failure modes, quoting the reply</div></div>
      <div class="node code"><div class="k">Check</div><div class="d">Every quote is confirmed; verdict set by fixed rules</div></div>
      <div class="node"><div class="k">Output</div><div class="d">Score, verdict, evidence, facts to verify</div></div>
    </div>
  </div>

  <div class="testimonial mt-24">
    <div class="q">&ldquo;</div>
    <blockquote>Disposal-rate KPIs reward speed, not accuracy. Officers are scored on closing volume. Nothing in the current system scores whether the closure was true.</blockquote>
    <div class="who">APFC, EPFO (Grievance Redressal Officer) · primary interview</div>
  </div>
</main></template>
<template id="tpl-1"><section class="band"><div class="inner">
  <div class="eyebrow">Resolution Judge</div>
  <h1>Was this grievance actually resolved?</h1>
  <p class="lead">Paste a citizen's complaint and the officer's closing reply. The Judge checks it against the five failure modes DARPG documents and the matching SOP, and gives a score with quoted evidence.</p>
</div></section>

<main class="page">
  <div class="split">
    <div class="card stack">
      <div class="chips"><span class="lbl">Try a case:</span>
        <button class="chip good" data-case="good">Specific reply</button>
        <button class="chip bad" data-case="boiler">Boilerplate</button>
        <button class="chip warn" data-case="padded">Padded with fake specifics</button>
        <button class="chip good" data-case="proof">Proof of payment</button>
        <button class="chip bad" data-case="bias">Distributor's word</button>
        <button class="chip bad" data-case="visit">"Visit the office"</button>
      </div>
      <label class="field"><span>Scheme <em>(or let Nivaran detect it)</em></span>
        <select id="scheme">
          <option value="auto">Auto-detect</option>
          <option value="PM-KISAN">PM-KISAN</option>
          <option value="NSAP">NSAP pensions</option>
          <option value="EPFO">EPFO</option>
          <option value="PASSPORT">Passport</option>
          <option value="NSP">National Scholarship</option>
          <option value="LPG">LPG / PMUY</option>
          <option value="PDS">PDS ration card</option>
        </select>
      </label>
      <label class="field"><span>Citizen complaint <span class="counter" id="c1"></span></span>
        <textarea id="complaint" maxlength="5000" placeholder="Paste the citizen's complaint…"></textarea>
      </label>
      <label class="field"><span>Officer's closing reply (ATR) <span class="counter" id="c2"></span></span>
        <textarea id="response" maxlength="5000" style="min-height:170px" placeholder="Paste the officer's reply…"></textarea>
      </label>
      <div id="formErr" class="err-box hidden"></div>
      <button class="btn btn-primary btn-block" id="go">Evaluate reply</button>
      <p class="hint">Don't paste real citizens' personal data in a demo.</p>
    </div>

    <div id="out">
      <div class="card empty" id="emptyState">
        <h3>No evaluation yet</h3>
        <p>Pick a case on the left, or paste your own, then press <b>Evaluate reply</b>.</p>
      </div>
      <div id="results" class="hidden"></div>
    </div>
  </div>

  <div class="card mode-guide">
    <details class="more"><summary><b>What each failure mode means</b> · from DARPG's own analysis of closures marked disposed but not resolved</summary>
      <div class="grid grid-2 mt-16" id="modeGuide"></div>
      <div class="grid grid-3 mt-16">
        <div class="ok-box"><b>Resolved</b> · 70 and above</div>
        <div class="warn-box"><b>Needs review</b> · 40 to 69</div>
        <div class="err-box"><b>Hollow closure</b> · below 40</div>
      </div>
      <p class="small muted mt-12">Score = average of five criteria (addresses the complaint, specific action, grounded in policy, written for this case, clear next steps). Failure modes lower the ceiling: a reply that answers a different issue cannot score above 20; any serious failure mode caps it at 59; two or more cap it at 39. A failure mode only counts if the exact words that show it are quoted from the reply.</p>
    </details>
  </div>
</main></template>
<template id="tpl-2"><section class="band"><div class="inner">
  <div class="eyebrow">Resolution Copilot</div>
  <h1>Draft a reply that actually resolves the case</h1>
  <p class="lead">Enter the complaint and what you found on the record. The Copilot pulls the matching SOP, drafts a cited reply, checks every deadline and amount, has the Judge score it, and revises it once if it falls short.</p>
</div></section>

<main class="page">
  <div class="split">
    <div class="card stack">
      <div class="chips"><span class="lbl">Try a case:</span>
        <button class="chip" data-case="widow">Widow pension</button>
        <button class="chip" data-case="pf">PF transfer</button>
        <button class="chip" data-case="passport">Passport delay</button>
        <button class="chip" data-case="comp">Compensation demand</button>

        <label class="field"><span>Citizen name</span><input type="text" id="citizen" maxlength="80" placeholder="e.g. Sunita Devi"></label>
        <label class="field"><span>Complaint ID <em>(optional)</em></span><input type="text" id="cid" maxlength="40" placeholder="e.g. CMP-2040"></label>
        <label class="field"><span>Scheme</span>
          <select id="scheme">
            <option value="auto">Auto-detect</option>
            <option value="PM-KISAN">PM-KISAN</option>
            <option value="NSAP">NSAP pensions</option>
            <option value="EPFO">EPFO</option>
            <option value="PASSPORT">Passport</option>
            <option value="NSP">National Scholarship</option>
            <option value="LPG">LPG / PMUY</option>
            <option value="PDS">PDS ration card</option>
          </select></label>
        <label class="field"><span>Department <em>(optional)</em></span><input type="text" id="dept" maxlength="80" placeholder="e.g. Rural Development"></label>
        <label class="field"><span>Reply language</span>
          <select id="lang"><option value="en">English</option><option value="hi">हिन्दी (Hindi)</option></select></label>
      </div>
      <div id="handoff" class="warn-box hidden"></div>
      <label class="field"><span>Citizen complaint <span class="counter" id="c1"></span></span>
        <textarea id="complaint" maxlength="5000" placeholder="Paste the citizen's complaint…"></textarea></label>
      <label class="field"><span>What you found on the record <em>(recommended)</em> <span class="counter" id="c2"></span></span>
        <textarea id="findings" maxlength="3000" style="min-height:90px" placeholder="e.g. Aadhaar authentication failed in August; re-authenticated on 3 Oct; arrears for Aug–Sep approved."></textarea>
        <div class="hint">The Copilot only states facts you give here or that are in the SOP. Leave it empty to get an interim reply that commits to specific checks.</div></label>
      <div id="formErr" class="err-box hidden"></div>
      <button class="btn btn-primary btn-block" id="go">Generate draft</button>

    <div id="out">
      <div class="card empty" id="emptyState">
        <h3>No draft yet</h3>
        <p>Pick a case or fill in the form, then press <b>Generate draft</b>. You'll see the draft, its quality score, and every check it went through.</p>

      <div id="results" class="hidden"></div>
    </div>

<template id="tpl-3"><section class="band"><div class="inner">
  <div class="eyebrow">Architecture, model and cost</div>
  <h1>How Nivaran works</h1>
  <p class="lead">What happens on each request, which model runs it and why, what it costs per session and at 10,000 officers, and what we have not built yet.</p>
</div></section>

<main class="page">
  <div class="card">
    <h2>Resolution Copilot · drafting a reply</h2>
    <div class="sub">Up to 4 AI calls per draft. Blue = AI; dashed = our code.</div>
    <div class="flow mt-16">
      <div class="node code"><div class="k">1 · Retrieve</div><div class="d">BM25 search over the SOP knowledge base; scheme given or auto-detected. No SOP → no draft.</div></div>
      <div class="node ai"><div class="k">2 · Draft</div><div class="d">Model writes the reply from the officer's findings and cited SOP sections only.</div></div>
      <div class="node code"><div class="k">3 · Verify</div><div class="d">Every citation must exist; every deadline or amount must be cited or come from the findings.</div></div>
      <div class="node ai"><div class="k">4 · Self-check</div><div class="d">The Judge scores the draft against the five failure modes.</div></div>
      <div class="node ai"><div class="k">5 · Revise</div><div class="d">If checks fail, the problems go back to the model once; the better-scoring draft is kept.</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Resolution Judge · checking a reply</h2>
    <div class="sub">1 AI call per check</div>
    <div class="flow amber mt-16">
      <div class="node"><div class="k">Input</div><div class="d">Complaint + officer's reply (+ scheme)</div></div>
      <div class="node code"><div class="k">Retrieve</div><div class="d">Matching scheme SOPs + grievance-handling standard</div></div>
      <div class="node ai"><div class="k">Score</div><div class="d">Model returns 5 criterion scores, failure modes with exact quotes, facts to verify (JSON). Today's date is supplied.</div></div>
      <div class="node code"><div class="k">Check</div><div class="d">Quotes not found in the reply are dropped. Score = average, then caps; verdict by fixed thresholds.</div></div>
      <div class="node"><div class="k">Output</div><div class="d">Score, verdict, evidence, cost</div></div>
    </div>
    <p class="small muted mt-12" id="rule"></p>
  </div>

  <div class="grid grid-2">
    <div class="card">
      <h2>Model</h2>
      <div class="sub">Set in one place (<code>api/_lib/config.js</code> or the <code>LLM_MODEL</code> setting)</div>
      <div id="modelBox" class="mt-12"></div>
      <h3 class="mt-16">Why a proprietary API</h3>
      <ul class="small" style="padding-left:18px;margin:8px 0 0">
        <li>Reliable JSON output and multilingual input (Hindi tested) at low cost.</li>
        <li>No GPU to run for a prototype; a pay-per-call cost that scales with use.</li>
        <li>Swappable: Gemini or OpenAI with one setting; the eval script re-tests any swap.</li>
      </ul>
      <h3 class="mt-16">Trade-offs we accept</h3>
      <ul class="small" style="padding-left:18px;margin:8px 0 0">
        <li>Citizen text goes to a foreign API. A department that requires data to stay in India would need an India-hosted open model (hybrid).</li>
        <li>Free-tier keys hit rate limits under load; production needs a billed key. The app retries automatically.</li>
      </ul>
    </div>

    <div class="card">
      <h2>Cost calculator</h2>
      <div class="sub">Uses real token counts from this browser when available</div>
      <div class="grid grid-2 mt-12" style="gap:10px">
        <label class="field"><span>Model</span><select id="cm"></select></label>
        <label class="field"><span>Officers</span><input type="text" id="co" value="10000"></label>
        <label class="field"><span>Grievances per officer / month</span><input type="text" id="cg" value="22"></label>
        <label class="field"><span>AI sessions per grievance</span><input type="text" id="cs" value="1"></label>
        <label class="field"><span>Input tokens / session</span><input type="text" id="ti" value="1707"></label>
        <label class="field"><span>Output tokens / session</span><input type="text" id="to" value="313"></label>
      </div>
      <p class="hint" id="tokNote"></p>
      <div class="statline mt-12" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat"><div class="k">Per session</div><div class="v" id="r1">—</div></div>
        <div class="stat"><div class="k">AI per month</div><div class="v" id="r2">—</div></div>

// Change the model or prices HERE only; every cost shown in the app is computed from this file.

const DEFAULT_MODELS = {
  gemini: 'gemini-3.5-flash-lite',
  openai: 'gpt-4o-mini',
};

// USD per 1M tokens (list prices checked October 2026; update if they change).

  'gemini-3.5-flash-lite': { input: 0.30, output: 2.50 },
  'gemini-3.1-flash-lite': { input: 0.25, output: 1.50 },
  'gemini-3.8-flash': { input: 0.75, output: 3.75 },
  'gpt-4o-mini': { input: 0.15, output: 0.60 },
  'gpt-5.6-luna': { input: 0.20, output: 1.20 },
};

const PRICES_AS_OF = 'Oct 2026';

function getProvider() {
  const forced = (process.env.LLM_PROVIDER || '').toLowerCase().trim();
  if (forced === 'offline') return 'offline';
  if (forced === 'gemini' && process.env.GEMINI_API_KEY) return 'gemini';
  if (forced === 'openai' && process.env.OPENAI_API_KEY) return 'openai';
  if (process.env.GEMINI_API_KEY) return 'gemini';
  if (process.env.OPENAI_API_KEY) return 'openai';
  return 'offline';
}

function getModel(provider = getProvider()) {
  if (provider === 'offline') return 'offline-rules';
  return (process.env.LLM_MODEL || '').trim() || DEFAULT_MODELS[provider];
}

function usdToInr() {
  const v = Number(process.env.USD_INR);
  return Number.isFinite(v) && v > 0 ? v : 96.28;
}

function priceFor(model) {
  return PRICING_USD_PER_M[model] || null;
}

// Thinking tokens (if the model reports them) are billed as output.
function costInr(model, inputTokens = 0, outputTokens = 0) {
  const p = priceFor(model);
  if (!p) return null;
  const usd = (inputTokens * p.input + outputTokens * p.output) / 1e6;
  return Math.round(usd * usdToInr() * 10000) / 10000;
}

function publicConfig() {
  const provider = getProvider();
  const model = getModel(provider);
  return {
    mode: provider === 'offline' ? 'offline' : 'live',
    provider,
    model,
    price: priceFor(model),
    usdInr: usdToInr(),
    pricesAsOf: PRICES_AS_OF,
    pricing: PRICING_USD_PER_M,
  };
}

module.exports = { getProvider, getModel, priceFor, costInr, usdToInr, publicConfig, PRICING_USD_PER_M, PRICES_AS_OF };

  BOILERPLATE: { label: '“Advised suitably” boilerplate', help: 'Template phrasing with no facts about this case.' },
  DEFLECTION: { label: '“Forwarded to” deflection', help: 'Passes the case on without owner or timeline.' },
  INSTITUTIONAL_BIAS: { label: 'Institutional bias in evidence', help: 'Relies only on the record of the party complained about.' },
  BURDEN_TRANSFER: { label: 'Burden transfer', help: 'Sends the citizen to an office or helpline instead of acting.' },
  NON_RESPONSIVE: { label: 'Answers a different issue', help: 'The reply is about something other than the complaint.' },
};

// Resolution Judge: retrieve SOPs -> model scores criteria + failure modes with evidence -> code checks and scores.
const { retrieve, schemeNames } = require('lib/retrieve');
const { callJSON, LLMError } = require('lib/llm');
const { judgeSystem, judgeUser, PROMPT_VERSION } = require('lib/prompts');
const { finalize } = require('lib/scoring');
const { judgeRaw } = require('lib/offline');
const { getProvider, getModel } = require('lib/config');
const { todayIST } = require('lib/today');
const { ensureKnowledgeBase } = require('lib/kb');

async function judge({ complaint, response, scheme }) {
  const started = Date.now();
  const kbSource = await ensureKnowledgeBase();
  const r = retrieve(`${complaint}\n${response}`, scheme, { k: 3, kGeneral: 1 });
  const sections = [...r.schemeSections, ...r.generalSections];
  const schemeLabel = r.scheme ? schemeNames[r.scheme] : null;
  const provider = getProvider();
  const today = todayIST();

  let raw;
  let usage = { input: 0, output: 0, thinking: 0 };
  let costInr = 0;
  let attempts = 1;
  if (provider === 'offline') {
    raw = judgeRaw({ complaint, response });
  } else {
    const out = await callJSON({
      system: judgeSystem(today),
      user: judgeUser({ complaint, response, schemeLabel, sections }),
      maxOutputTokens: 900,
    });
    raw = out.json;
    usage = out.usage;
    costInr = out.costInr;
    attempts = out.attempts;
  }

  let result;
  try {
    result = finalize(raw, response);
  } catch (e) {
    throw new LLMError('BAD_OUTPUT', 'The AI returned an incomplete evaluation. Please try again.', 502);
  }

  return {
    ...result,
    scheme: r.scheme,
    schemeLabel,
    schemeDetected: r.detected,
    kbSource,
    sources: sections.map(({ id, label, title, scheme: s }) => ({ id, label, title, scheme: s })),
    usage,
    costInr,
    attempts,
    model: getModel(provider),
    mode: provider === 'offline' ? 'offline' : 'live',
    promptVersion: PROMPT_VERSION,
    today,
    ms: Date.now() - started,
  };
}

module.exports = { judge };

// 1 retrieve SOPs -> 2 draft (grounded) -> 3 verify citations & numbers in code -> 4 self-check with the Judge

const { todayIST } = require('lib/today');

      noSopFound: true,
      message: 'No SOP in the knowledge base covers this complaint, so Nivaran will not draft a reply. Route it for human drafting, or choose the correct scheme.',

      totals,

      mode: offline ? 'offline' : 'live',

    quality,
    revised,
    firstDraft,
    trace,
    totals,
    model: getModel(provider),
    mode: offline ? 'offline' : 'live',
    promptVersion: PROMPT_VERSION,
    ms: Date.now() - started,
  };
}

module.exports = { runCopilot };

// Small helpers shared by the API routes (work on Vercel and on the local server).
const { FRIENDLY } = require('lib/llm');

function send(res, status, obj) {
  res.statusCode = status;
  res.setHeader('Content-Type', 'application/json; charset=utf-8');
  res.setHeader('Cache-Control', 'no-store');
  res.end(JSON.stringify(obj));
}

async function readBody(req) {
  if (req.body !== undefined && req.body !== null) {
    if (typeof req.body === 'string') return JSON.parse(req.body || '{}');
    if (Buffer.isBuffer(req.body)) return JSON.parse(req.body.toString('utf8') || '{}');
    return req.body;
  }
  const chunks = [];
  for await (const c of req) chunks.push(c);
  const raw = Buffer.concat(chunks).toString('utf8');
  return raw ? JSON.parse(raw) : {};
}

class InputError extends Error {}

function field(body, name, label, { required = true, min = 0, max = 5000 } = {}) {
  const v = body[name];
  if (v === undefined || v === null || v === '') {
    if (required) throw new InputError(`${label} is required.`);
    return '';
  }
  if (typeof v !== 'string') throw new InputError(`${label} must be text.`);
  const t = v.trim();
  if (required && t.length < min) throw new InputError(`${label} is too short (at least ${min} characters).`);
  if (t.length > max) throw new InputError(`${label} is too long (max ${max} characters).`);
  return t;
}

// Wrap a handler with method check, JSON parsing and friendly errors.
function handler(method, fn) {
  return async (req, res) => {
    if (req.method !== method) return send(res, 405, { error: 'Method not allowed.' });
    let body = {};
    if (method === 'POST') {
      try { body = await readBody(req); } catch (_) { return send(res, 400, { error: 'Request body must be valid JSON.' }); }
      if (!body || typeof body !== 'object' || Array.isArray(body)) return send(res, 400, { error: 'Request body must be a JSON object.' });
    }
    try {
      const out = await fn(body, req);
      return send(res, 200, out);
    } catch (e) {
      if (e instanceof InputError) return send(res, 400, { error: e.message });
      const code = e.code || 'SERVER';
      const status = code === 'QUOTA' ? 429 : code === 'AUTH' || code === 'MODEL' ? 503 : code === 'BLOCKED' ? 422 : code === 'TIMEOUT' ? 504 : 502;
      // Never forward raw provider messages to the browser.
      const message = FRIENDLY[code] || 'Something went wrong on our side. Please try again.';
      if (process.env.NODE_ENV !== 'test') console.error(`[api] ${code}:`, e.message);
      return send(res, status, { error: message, code, retryable: ['QUOTA', 'UPSTREAM', 'TIMEOUT', 'NETWORK', 'BAD_OUTPUT'].includes(code) });
    }
  };
}

module.exports = { send, readBody, field, handler, InputError };

__def("lib/supabase", function (module, exports, require) {
// Supabase (PostgREST over HTTPS, no npm package). Used for two things:
//   1. the SOP knowledge base (table sop_sections), with data/sops.json as the fallback
//   2. a log of every AI request (table ai_runs): tokens, cost, verdict, time. No citizen text is stored.
// Everything here is optional: if SUPABASE_URL / SUPABASE_SERVICE_KEY are not set, or Supabase is down,
// Nivaran keeps working from the local file and simply skips logging.

function config() {
  const url = (process.env.SUPABASE_URL || '').trim().replace(/\/+$/, '');
  const key = (process.env.SUPABASE_SERVICE_KEY || process.env.SUPABASE_SERVICE_ROLE_KEY || '').trim();
  return url && key ? { url, key } : null;
}

function enabled() {
  return !!config();
}

function headers(key, extra = {}) {
  const h = { apikey: key, 'Content-Type': 'application/json', ...extra };
  // Legacy service_role keys are JWTs and also go in Authorization; new "sb_secret_" keys only need apikey.
  if (key.startsWith('eyJ')) h.Authorization = `Bearer ${key}`;
  return h;
}

async function request(path, { method = 'GET', body, timeoutMs = 4000, prefer } = {}) {
  const c = config();
  if (!c) throw new Error('Supabase not configured');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(`${c.url}/rest/v1/${path}`, {
      method,
      headers: headers(c.key, prefer ? { Prefer: prefer } : {}),
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: ctrl.signal,
    });
    const text = await res.text();
    if (!res.ok) throw new Error(`Supabase ${res.status}`);
    return text ? JSON.parse(text) : null;
  } finally {
    clearTimeout(timer);
  }
}

// ---------- 1. SOP knowledge base ----------
async function fetchSopSections() {
  const rows = await request('sop_sections?select=id,scheme,scheme_label,section,title,text,keywords&order=sort_order.asc');
  if (!Array.isArray(rows) || !rows.length) throw new Error('sop_sections is empty');
  return rows;
}

// ---------- 2. AI run log ----------
// Awaited with a short timeout so it finishes on serverless platforms, but never throws.
async function logRun(row) {
  if (!enabled()) return false;
  try {
    await request('ai_runs', { method: 'POST', body: row, timeoutMs: 1500, prefer: 'return=minimal' });
    return true;
  } catch (e) {
    if (process.env.NODE_ENV !== 'test') console.warn('[supabase] run not logged:', e.message);
    return false;
  }
}

async function fetchStats() {
  return request('ai_run_stats?select=*');
}

module.exports = { enabled, fetchSopSections, logRun, fetchStats };

__def("lib/kb", function (module, exports, require) {
// Loads the SOP knowledge base from Supabase (table sop_sections) when configured.
// Cached for 10 minutes per server instance. On any failure the built-in data/sops.json stays in use,
// and the next attempt waits 1 minute so a Supabase outage never slows every request down.
const supabase = require('lib/supabase');
const { setCorpus, resetCorpus, corpusSource } = require('lib/retrieve');

const TTL_MS = 10 * 60 * 1000;
const RETRY_MS = 60 * 1000;
let loadedAt = 0;
let failedAt = 0;
let lastError = null;
let pending = null;

function rowsToCorpus(rows) {
  const schemes = {};
  const sections = rows.map((r) => {
    schemes[r.scheme] = r.scheme_label || r.scheme;
    return {
      id: String(r.id),
      scheme: String(r.scheme),
      section: String(r.section),
      title: String(r.title || ''),
      text: String(r.text || ''),
      keywords: Array.isArray(r.keywords) ? r.keywords.map(String) : [],
    };
  });
  return { schemes, sections };
}

async function load() {
  try {
    const rows = await supabase.fetchSopSections();
    const ok = setCorpus(rowsToCorpus(rows), 'supabase');
    if (!ok) throw new Error('sop_sections rows were not usable');
    loadedAt = Date.now();
    lastError = null;
  } catch (e) {
    failedAt = Date.now();
    lastError = e.message;
    if (corpusSource() !== 'file') resetCorpus();
    if (process.env.NODE_ENV !== 'test') console.warn('[kb] using data/sops.json:', e.message);
  }
}

// Call before retrieval. Never throws.
async function ensureKnowledgeBase() {
  if (!supabase.enabled()) {
    if (corpusSource() !== 'file') resetCorpus();
    return corpusSource();
  }
  const now = Date.now();
  const fresh = corpusSource() === 'supabase' && now - loadedAt < TTL_MS;
  const coolingDown = now - failedAt < RETRY_MS;
  if (fresh || coolingDown) return corpusSource();
  if (!pending) pending = load().finally(() => { pending = null; });
  await pending;
  return corpusSource();
}

function kbStatus() {
  return { source: corpusSource(), supabaseConfigured: supabase.enabled(), lastError };
}

// For tests.
function _reset() { loadedAt = 0; failedAt = 0; lastError = null; pending = null; resetCorpus(); }

module.exports = { ensureKnowledgeBase, kbStatus, _reset };

<script>
/* Shared front-end helpers for every Nivaran page. */
(function () {
  const ICON = {
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    judge: '<circle cx="12" cy="12" r="9"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  function store(kind) {
    try { const s = window[kind]; const k = '__t'; s.setItem(k, '1'); s.removeItem(k); return s; } catch (_) { return null; }
  }
  const SS = store('sessionStorage');
  const LS = store('localStorage');
  const getJSON = (s, k, d) => { try { const v = s && s.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } };

  // Single-file build (Nivaran.html) uses #/routes; the server build uses real paths.
  const STANDALONE = !!window.__NIVARAN_STANDALONE;
  const link = (p) => (STANDALONE ? `#${p}` : p);

  function currentPath() {
    if (STANDALONE) return (location.hash.replace(/^#/, '') || '/').split('?')[0];

  }

    const top = document.createElement('header');
    top.className = 'topbar';

  }

  function usageHtml({ mode, model, calls, tin, tout, cost, ms }) {

    { name: '“Advised suitably” boilerplate', what: 'Template wording with no facts about this case. It could be sent to anyone.', eg: '“Necessary action has been taken. The applicant has been advised suitably.”' },
    { name: '“Forwarded to” deflection', what: 'Passed to another office or officer with no name, owner or timeline, and closed.', eg: '“Your complaint has been forwarded to the concerned department.”' },
    { name: 'Institutional bias in evidence', what: 'Closed on the word of the party being complained about.', eg: '“As per the distributor’s records, the cylinder was delivered.”' },
    { name: 'Burden transfer', what: 'Sends the citizen to an office, a helpline or to re-apply instead of moving the case forward.', eg: '“Please visit the office in person with all original documents.”' },
    { name: 'Answers a different issue', what: 'The reply is about another scheme, request or person.', eg: 'A passport dispatch update sent in reply to a PM-KISAN complaint.' },
  ];
  const guide = $('#modeGuide');
  if (guide) guide.innerHTML = GUIDE.map((m) => `<div class="fm"><div class="t">⚠ ${esc(m.name)}</div><div class="small mt-8">${esc(m.what)}</div><blockquote>${esc(m.eg)}</blockquote></div>`).join('');

  const complaint = $('#complaint');
  const response = $('#response');
  const scheme = $('#scheme');
  counter(complaint, $('#c1'), 5000);
  counter(response, $('#c2'), 5000);

  $$('[data-case]').forEach((b) => b.addEventListener('click', () => {
    const c = CASES[b.dataset.case];
    complaint.value = c.complaint; response.value = c.response; scheme.value = c.scheme;
    complaint.dispatchEvent(new Event('input')); response.dispatchEvent(new Event('input'));
  }));

  // Arrive from the Copilot with its draft pre-filled.
  const handoff = getJSON(SS, 'nivaran.toJudge', null);
  if (handoff) {
    complaint.value = handoff.complaint || ''; response.value = handoff.response || ''; scheme.value = handoff.scheme || 'auto';
    complaint.dispatchEvent(new Event('input')); response.dispatchEvent(new Event('input'));
    try { SS.removeItem('nivaran.toJudge'); } catch (_) { /* ignore */ }
  }

  function showErr(msg) { const e = $('#formErr'); e.textContent = msg; e.classList.toggle('hidden', !msg); }

  $('#go').addEventListener('click', async () => {
    showErr('');
    if (complaint.value.trim().length < 15) return showErr('Please paste the citizen complaint (at least 15 characters).');
    if (response.value.trim().length < 10) return showErr("Please paste the officer's reply (at least 10 characters).");
    const btn = $('#go');
    busy(btn, true, 'Evaluating…');
    try {
      const r = await api('/api/evaluate', { complaint: complaint.value, response: response.value, scheme: scheme.value });
      addUsage(r.costInr, r.mode === 'live' ? r.attempts || 1 : 0, r.usage.input, r.usage.output, 'judge', r.mode, r.model);
      render(r);
    } catch (e) {
      showErr(e.message + (e.retryable ? ' (You can press Evaluate again.)' : ''));
    } finally { busy(btn, false); }
  });

  function render(r) {
    $('#emptyState').classList.add('hidden');
    const el = $('#results');
    el.classList.remove('hidden');
    const capNote = r.capApplied != null ? `<div class="cap-note">Average of criteria was ${r.uncappedScore}; capped at ${r.capApplied} because of the failure modes found.</div>` : '';
    const offline = r.mode === 'offline' ? '<div class="warn-box mt-12">Demo mode: this is a rule-based estimate, not the AI Judge.</div>' : '';
    el.innerHTML = `
      <div class="card">
        <div class="score-wrap">
          ${ring(r.overallScore, r.verdictKey)}
          <div>
            <div class="small muted">Verdict</div>
            <div class="verdict-title">${esc(r.verdict)}</div>
            <div class="mt-8"><span class="pill ${r.verdictKey}">${r.verdictKey === 'resolved' ? '✔ Resolved' : r.verdictKey === 'review' ? '● Needs review' : '✖ Hollow closure'}</span>
              ${r.schemeLabel ? `<span class="pill blue">${esc(r.schemeLabel)}${r.schemeDetected ? ' · auto-detected' : ''}</span>` : ''}</div>
            ${capNote}
          </div>
        </div>
        ${r.explanation ? `<p class="mt-16">${esc(r.explanation)}</p>` : ''}
        ${offline}
        ${window.N.usageHtml({ mode: r.mode, model: r.model, calls: 1, tin: r.usage.input, tout: r.usage.output, cost: r.costInr, ms: r.ms })}
        ${r.verdictKey !== 'resolved' ? '<div class="row mt-16"><button class="btn btn-primary" id="rewrite">Rewrite this reply with the Copilot →</button><span class="small muted">Carries over the complaint and the problems found</span></div>' : ''}
      </div>

      <div class="card">
        <div class="card-head"><div><h2>Five criteria</h2><div class="sub">Each question is scored separately; the verdict follows fixed rules.</div></div></div>
        <div>${r.criteria.map((c) => `
          <div class="crit"><div class="name">${esc(c.name)}</div><div class="bar"><i class="${barClass(c.score)}" style="width:${c.score}%"></i></div><div class="val">${c.score}</div>
          ${c.reason ? `<div class="reason">${esc(c.reason)}</div>` : ''}</div>`).join('')}</div>
      </div>

      <div class="card">
        <div class="card-head"><div><h2>Failure modes found</h2><div class="sub">Each one must quote the reply. Quotes not found in the reply are discarded.</div></div></div>
        ${r.failureModes.length ? r.failureModes.map((m) => `
          <div class="fm"><div class="t">⚠ ${esc(m.label)}</div><div class="h">${esc(m.help)}</div><blockquote>“${esc(m.evidence)}”</blockquote></div>`).join('')
          : '<div class="ok-box">✔ None of the documented failure modes found in this reply.</div>'}
        ${r.discardedModes && r.discardedModes.length ? `<p class="hint mt-8">${r.discardedModes.length} suggested failure mode(s) discarded because the quoted evidence was not in the reply.</p>` : ''}
      </div>

      ${r.claimsToVerify && r.claimsToVerify.length ? `<div class="card"><h2>Facts a supervisor should verify</h2><div class="sub">The Judge cannot check records; these are the claims the closure rests on.</div>
        <ul class="list-clean mt-12">${r.claimsToVerify.map((c) => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}

      <div class="card">
        <h2>Rules this was checked against</h2>
        <ul class="list-clean mt-12">${r.sources.map((s) => `<li class="src"><span class="id">${esc(s.id)}</span><span>${esc(s.label)} — ${esc(s.title)}</span></li>`).join('')}</ul>
        <details class="more"><summary>How the score is worked out</summary><p class="small">${esc(r.scoringRule)}</p></details>
      </div>`;
    const rw = $('#rewrite');
    if (rw) rw.addEventListener('click', () => {
      const issues = [
        ...r.failureModes.map((m) => `${m.label} (“${m.evidence}”)`),
        ...r.criteria.filter((c) => c.score < 60).map((c) => `Weak on “${c.name}”: ${c.reason}`),
      ];
      window.N.setJSON(SS, 'nivaran.toCopilot', { complaint: complaint.value, scheme: r.scheme || scheme.value, issues, score: r.overallScore, verdict: r.verdict });
      window.N.go('/copilot');
    });
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
})();

} };

PAGES["/how"] = { tpl: 'tpl-3', title: "How it works · Nivaran", init: function () {
/* How it works: model info, cost calculator, knowledge base */

  const { $, esc, health, getUsage } = window.N;
  const HOSTING_USD = 20;

  (async function init() {
    const h = await health();

         <div class="stat"><div class="k">List price per 1M tokens</div><div class="v" style="font-size:14px">${h.price ? `$${h.price.input} in · $${h.price.output} out` : 'not in price table'}</div></div></div>`
      : '<div class="warn-box">Offline demo mode: no API key configured, so a rule-based stand-in runs. Add GEMINI_API_KEY or OPENAI_API_KEY to enable the AI.</div>';
    $('#fx').textContent = `₹${h.usdInr} per $ (${h.pricesAsOf})`;
    const kbSrc = h.knowledgeBase && h.knowledgeBase.source === 'supabase' ? 'Supabase (table sop_sections)' : 'built-in file data/sops.json';

    const sel = $('#cm');

    if (h.pricing[h.model]) sel.value = h.model;

    const u = getUsage();
    if (u.calls > 0 && u.tin > 0) {
      // Average per AI call measured in this browser; a Judge-only session is 1 call, a Copilot draft is 2-4.
      $('#tokNote').textContent = `This browser has made ${u.calls} AI calls averaging ${Math.round(u.tin / u.calls)} input / ${Math.round(u.tout / u.calls)} output tokens per call. Defaults above are one draft + one check measured on the earlier build (7 Oct 2026); replace them with the figures from npm run eval.`;

      $('#tokNote').textContent = 'Defaults: one draft + one check measured on the earlier build (7 Oct 2026). Replace with figures from npm run eval, or use the Judge/Copilot and watch the token counts.';
    }

    function calc() {
      const p = h.pricing[sel.value];

      const perSession = ((num('#ti') * p.input + num('#to') * p.output) / 1e6) * h.usdInr;

    calc();
  })();

  // Usage measured from logged runs (Supabase).

    const card = (title, r, extra) => (r ? `<div class="card" style="margin:0;box-shadow:none">

        <div class="statline mt-12" style="grid-template-columns:repeat(3,1fr)">
          <div class="stat"><div class="k">Avg cost</div><div class="v">₹${num(r.avg_cost_inr, 3)}</div></div>
          <div class="stat"><div class="k">Avg tokens in / out</div><div class="v">${num(r.avg_tokens_in)} / ${num(r.avg_tokens_out)}</div></div>
          <div class="stat"><div class="k">Avg time</div><div class="v">${num(r.avg_latency_ms / 1000, 1)} s</div></div>

    box.innerHTML = `<div class="grid grid-2">
      ${card('Resolution Judge', by.judge, (r) => `<div class="stat"><div class="k">Hollow closures</div><div class="v">${num(r.pct_hollow, 0)}%</div></div><div class="stat"><div class="k">Resolved</div><div class="v">${num(r.pct_resolved, 0)}%</div></div>`)}
      ${card('Resolution Copilot', by.copilot, (r) => `<div class="stat"><div class="k">Auto-revised</div><div class="v">${num(r.pct_revised, 0)}%</div></div><div class="stat"><div class="k">Avg final score</div><div class="v">${num(r.avg_score)}</div></div>`)}
    </div>`;
    const j = by.judge; const c = by.copilot;
    if (j && c) {
      const session = Number(j.avg_cost_inr) + Number(c.avg_cost_inr);
      $('#statsSub').textContent = `Measured session (1 Copilot draft + 1 Judge check): ₹${session.toFixed(3)} · ${num(Number(j.runs) + Number(c.runs))} runs logged in Supabase`;
      // Feed the measured tokens into the cost calculator.
      $('#ti').value = Math.round(Number(j.avg_tokens_in) + Number(c.avg_tokens_in));
      $('#to').value = Math.round(Number(j.avg_tokens_out) + Number(c.avg_tokens_out));
      $('#ti').dispatchEvent(new Event('input'));
      $('#tokNote').textContent = 'Token defaults now come from the runs logged in Supabase (1 Copilot draft + 1 Judge check per grievance).';
    }
  }).catch(() => { $('#stats').innerHTML = '<div class="warn-box">Could not load usage stats.</div>'; });

  fetch('/api/sops').then((r) => r.json()).then((kb) => {
    $('#kbNotice').textContent = kb.notice;
    $('#kbSub').textContent = `${kb.sections.length} sections across ${Object.keys(kb.schemes).length} areas · loaded from ${kb.source === 'supabase' ? 'Supabase' : 'the built-in file (data/sops.json)'}`;
    const by = {};
    kb.sections.forEach((s) => { (by[s.schemeLabel] = by[s.schemeLabel] || []).push(s); });
    $('#kb').innerHTML = Object.entries(by).map(([name, list]) => `<details class="more"><summary>${esc(name)} (${list.length})</summary>
      ${list.map((s) => `<div class="kb-item"><span class="src"><span class="id">${esc(s.id)}</span><b>${esc(s.label)} — ${esc(s.title)}</b></span><p>${esc(s.text)}</p></div>`).join('')}</details>`).join('');
  }).catch(() => { $('#kb').innerHTML = '<div class="err-box">Could not load the knowledge base.</div>'; });
})();

} };
PAGES["/404"] = { tpl: 'tpl-4', title: "Not found · Nivaran", init: function () {

} };

(function () {
  function render() {
    var route = (location.hash.replace(/^#/, '') || '/').split('?')[0];
    var page = PAGES[route] || PAGES['/404'];
    var root = document.getElementById('root');
    root.innerHTML = document.getElementById(page.tpl).innerHTML;
    document.title = page.title;
    window.scrollTo(0, 0);
    if (window.N) window.N.markNav();
    try { page.init(); } catch (e) { console.error(e); }
  }
  window.__nivaranRender = render;
  window.addEventListener('hashchange', render);
  document.addEventListener('DOMContentLoaded', render);
})();
</script>
